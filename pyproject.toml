[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-mission-control"
version = "0.3.0"
description = "Policy-aware orchestration and quota telemetry for the Antigravity CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "YuxiaoMa66"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
agy-mc = "antigravity_mission_control.cli:main"

[tool.setuptools]
packages = ["antigravity_mission_control"]

[tool.setuptools.package-data]
antigravity_mission_control = ["skill_bundle/**/*"]

[tool.setuptools.exclude-package-data]
antigravity_mission_control = ["skill_bundle/**/__pycache__/*", "skill_bundle/**/*.pyc", "skill_bundle/**/*.pyo"]
