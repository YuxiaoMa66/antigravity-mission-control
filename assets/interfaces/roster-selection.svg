<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Choose the right team.</title>
<desc id="desc">Strict is the default. Balanced is an explicit user choice. Illustrative command and field excerpts, not a live screenshot.</desc>
<rect width="1280" height="800" rx="20" fill="#10191e"/>
<rect x="48" y="48" width="5" height="96" fill="#79d8e2"/>
<text x="72" y="88" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#f3f7f8">Choose the right team.</text>
<text x="72" y="133" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#acbbc2">Strict is the default. Balanced is an explicit user choice.</text>
<rect x="48" y="182" width="1184" height="524" rx="10" fill="#162229" stroke="#2d3e47"/>
<text x="72" y="215" font-family="Menlo, monospace" font-size="17" fill="#9cabb2">assignment policy</text>
<g xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="21"><text x="72" y="254" fill="#79d8e2">STRICT-YUXIAO</text>
<text x="72" y="288" fill="#dce5e9">A   Smallest adequate team</text>
<text x="72" y="322" fill="#dce5e9">B   Capability and independent review</text>
<text x="72" y="356" fill="#dce5e9">C   Latest available Gemini Flash High</text>
<text x="72" y="390" fill="#dce5e9"></text>
<text x="72" y="424" fill="#79d8e2">BALANCED</text>
<text x="72" y="458" fill="#dce5e9">One exact assignment for approval</text>
<text x="72" y="492" fill="#dce5e9"></text>
<text x="72" y="526" fill="#dce5e9">Both retain exact model and scope approval.</text>
<text x="72" y="560" fill="#dce5e9">Unrestricted execution requires separate authorization.</text></g>
<text x="72" y="756" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9cabb2">Antigravity Mission Control  /  v0.2.0</text>
<text x="1208" y="756" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9cabb2">Illustrative commands and fields</text>
</svg>
