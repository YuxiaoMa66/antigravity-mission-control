<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Dispatch. Collect. Inspect.</title>
<desc id="desc">A completed worker still needs independent acceptance. Illustrative command and field excerpts, not a live screenshot.</desc>
<rect width="1280" height="800" rx="12" fill="#141615"/>
<path d="M48 48H1232M48 748H1232" stroke="#30352f"/>
<rect x="64" y="48" width="7" height="94" fill="#e6a15d"/>
<text x="92" y="76" font-family="Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#e6a15d">MISSION CONTROL  /  V0.4.0</text>
<text x="92" y="122" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#f2eee5">Dispatch. Collect. Inspect.</text>
<text x="92" y="162" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#a4a59c">A completed worker still needs independent acceptance.</text>
<text x="1232" y="76" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="1.4" fill="#a4a59c">OPERATIONAL EVIDENCE PLATE</text>
<rect x="64" y="208" width="1152" height="502" rx="8" fill="#20231f" stroke="#454a42"/>
<rect x="64" y="208" width="8" height="502" fill="#e6a15d"/>
<text x="92" y="244" font-family="Menlo, Consolas, monospace" font-size="16" fill="#a4a59c">run / wait / result</text>
<rect x="978" y="222" width="210" height="32" rx="6" fill="#2b302a" stroke="#555b53"/>
<text x="1083" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" letter-spacing="1" fill="#e6a15d">ROUTE / GUARD / VERIFY</text>
<path d="M92 260H1188" stroke="#343a33"/>
<g xml:space="preserve" font-family="Menlo, Consolas, monospace" font-size="20"><text x="92" y="286" fill="#555b53">01</text>
<text x="142" y="286" fill="#e6a15d">$ agy-mc run &lt;approved-run-fields&gt; --background</text>
<text x="92" y="320" fill="#555b53">02</text>
<text x="142" y="320" fill="#d8d4ca"></text>
<text x="92" y="354" fill="#555b53">03</text>
<text x="142" y="354" fill="#d8d4ca">job_id:          implementer-&lt;timestamp&gt;-&lt;id&gt;</text>
<text x="92" y="388" fill="#555b53">04</text>
<text x="142" y="388" fill="#d8d4ca">evidence_path:   &lt;private-job-dir&gt;/workspace-evidence</text>
<text x="92" y="422" fill="#555b53">05</text>
<text x="142" y="422" fill="#d8d4ca"></text>
<text x="92" y="456" fill="#555b53">06</text>
<text x="142" y="456" fill="#e6a15d">$ agy-mc wait &lt;job-id&gt; --timeout 300s</text>
<text x="92" y="490" fill="#555b53">07</text>
<text x="142" y="490" fill="#d8d4ca"></text>
<text x="92" y="524" fill="#555b53">08</text>
<text x="142" y="524" fill="#d8d4ca">status:          done</text>
<text x="92" y="558" fill="#555b53">09</text>
<text x="142" y="558" fill="#d8d4ca">acceptance:      not_evaluated</text>
<text x="92" y="592" fill="#555b53">10</text>
<text x="142" y="592" fill="#d8d4ca"></text>
<text x="92" y="626" fill="#555b53">11</text>
<text x="142" y="626" fill="#d8d4ca">Inspect the real diff and checks against the original task.</text></g>
<text x="92" y="774" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="1" fill="#a4a59c">ANTIGRAVITY MISSION CONTROL  /  STATIC ILLUSTRATION</text>
<text x="1232" y="774" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" fill="#a4a59c">TEXT AND VALUES ARE EXAMPLES</text>
